<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown</title>
    <script src="../../gridora.js"></script>
    <style>
      body { display: flex; flex-direction: column; justify-content: center; padding: 20px; }
      .title { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
      .days { margin-top: 4px; font-size: clamp(32px, 28vmin, 96px); font-weight: 600; line-height: 1; letter-spacing: -0.03em; }
      .unit { font-size: 14px; color: var(--muted); }
      button { align-self: flex-start; margin-top: 12px; padding: 6px 12px; border: 0; border-radius: 999px;
               background: var(--subtle); color: var(--fg); font: inherit; font-size: 12px; cursor: pointer; }
      [hidden] { display: none; }
    </style>
  </head>
  <body>
    <div class="title" id="title"></div>
    <div id="count"><span class="days" id="days"></span> <span class="unit" id="unit"></span></div>
    <button id="set" hidden>Pick a date</button>
    <script>
      const $ = (id) => document.getElementById(id)
      let settings = {}

      function render() {
        $('title').textContent = settings.title || 'Countdown'
        // Parse as a local date so the count flips at the user's midnight, not UTC's.
        const [y, m, d] = String(settings.date || '').split('-').map(Number)
        const target = new Date(y, m - 1, d)
        const valid = Boolean(y && m && d && !isNaN(target))
        $('count').hidden = !valid
        $('set').hidden = valid
        if (!valid) return
        const today = new Date()
        today.setHours(0, 0, 0, 0)
        const days = Math.round((target - today) / 86400000)
        $('days').textContent = Math.abs(days)
        $('unit').textContent = days === 0 ? 'today!' : `${Math.abs(days) === 1 ? 'day' : 'days'} ${days > 0 ? 'to go' : 'ago'}`
      }

      $('set').onclick = () => Gridora.openSettings()
      Gridora.onState((state) => {
        settings = state.settings
        render()
      })
      setInterval(render, 60_000)
    </script>
  </body>
</html>
